name: Android Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calar-saat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Çalar Saat APK build #${{ github.run_number }}"
          body: "Otomatik derlenmiş debug APK. Telefonunuzda 'Bilinmeyen kaynaklardan yükleme'ye izin vermeniz gerekebilir."
          files: app/build/outputs/apk/debug/app-debug.apk
